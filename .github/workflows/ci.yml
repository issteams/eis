name: CI

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=eis --cov-report=term-missing

  release-validation:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install 'build>=1.2,<2' 'pip-audit>=2.7,<3'
      - run: python -m build
      - run: python -m venv /tmp/eis-clean
      - run: /tmp/eis-clean/bin/pip install dist/*.whl
      - run: /tmp/eis-clean/bin/python -c "import eis; assert eis.__version__ == '1.0.0'"
      - run: /tmp/eis-clean/bin/pip-audit
      - run: python -m benchmarks.performance
